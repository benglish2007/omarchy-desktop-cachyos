# CYBEROPS visual layer for CachyOS + Hyprland
# Safe to source after the distro's normal Hyprland configuration.

$cyber_bg = rgb(050816)
$cyber_bg_dark = rgb(03040c)
$cyber_panel = rgb(10192b)
$cyber_fg = rgb(e7fbff)
$cyber_dim = rgb(74849c)
$cyber_cyan = rgb(00f5ff)
$cyber_magenta = rgb(ff2d95)
$cyber_green = rgb(39ff14)
$cyber_red = rgb(ff3147)
$cyber_yellow = rgb(ffe600)
$cyber_blue = rgb(2378ff)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(00f5ffee) rgba(ff2d95ee) rgba(39ff14ee) 45deg
    col.inactive_border = rgba(34405aaa)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.97

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00f5ff20)
        color_inactive = rgba(00000050)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = cyberEase, 0.22, 1, 0.36, 1
    bezier = cyberFast, 0.4, 0, 0.2, 1
    animation = windows, 1, 4, cyberEase
    animation = windowsOut, 1, 3, cyberFast, popin 82%
    animation = border, 1, 5, cyberEase
    animation = borderangle, 1, 8, cyberEase
    animation = fade, 1, 4, cyberEase
    animation = workspaces, 1, 4, cyberEase, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Helpful Omarchy-like bindings. Existing identical bindings later in your
# main config will still take precedence according to Hyprland's parsing.
bind = SUPER, Return, exec, cyberops-terminal
bind = SUPER, Space, exec, cyberops-launch
bind = SUPER SHIFT, W, exec, cyberops-wallpaper next
bind = SUPER SHIFT, R, exec, cyberops-reload
